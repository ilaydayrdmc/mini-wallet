server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API istekleri backend container'ina iletilir (Vite dev proxy'sinin production karsiligi)
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React uygulamasi: bilinmeyen yollar index.html'e duser
    location / {
        try_files $uri /index.html;
    }
}
