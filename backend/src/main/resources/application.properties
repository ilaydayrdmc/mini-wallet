spring.application.name=wallet

spring.datasource.url=jdbc:postgresql://localhost:5432/wallet
spring.datasource.username=wallet
spring.datasource.password=wallet

# Sema artik Flyway migration dosyalariyla yonetilir (db/migration).
# Hibernate sadece entity ile tablolarin uyustugunu dogrular.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT. Bu varsayilan sir SADECE yerel gelistirme icindir (en az 32 karakter).
# Gercek ortamda JWT_SECRET ortam degiskeniyle ezilmelidir.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
app.jwt.expiration=1h
